# VERIFY-F1 invalid fixture — prototype-pollution field path.
# __proto__/constructor/prototype segments are forbidden by the field pattern.
# Must fail validatePayload('policy', …) at load. See docs/policy-dsl.md.
policy_version: "1.0.0"

global_rules:
  - id: proto-path
    severity: reject
    when: { field: "attested_by.__proto__.polluted", op: exists }

# dogfood.yml — copy this into YOUR repo at .github/workflows/dogfood.yml
#
# What it does: after your tests run, it packages the result into a dogfood
# submission and dispatches it to dogfood-lab/testing-os, which verifies the
# provenance (it confirms THIS GitHub Actions run actually happened) and records
# the evidence. See https://dogfood-lab.github.io/testing-os/handbook/integration/
#
# ── ONE-TIME SETUP (the step everyone forgets) ───────────────────────────────
# Mint a fine-grained PAT with `contents: write` on dogfood-lab/testing-os and
# add it to THIS repo as the secret DOGFOOD_TOKEN
# (Settings → Secrets and variables → Actions → New repository secret).
# Without it, the dispatch cannot authenticate — and the preflight step below
# FAILS LOUD instead of letting the run go green with nothing recorded.
# ─────────────────────────────────────────────────────────────────────────────

name: dogfood

on:
  # Run after your test workflow completes. Replace "CI" with your test
  # workflow's name. (Or fold these steps into your existing test job.)
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: dogfood-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dogfood:
    runs-on: ubuntu-latest
    steps:
      # Fail LOUD if the token is missing — this is the #1 silent-failure mode.
      - name: Preflight — DOGFOOD_TOKEN must be set
        env:
          DOGFOOD_TOKEN: ${{ secrets.DOGFOOD_TOKEN }}
        run: |
          if [ -z "$DOGFOOD_TOKEN" ]; then
            echo "::error title=DOGFOOD_TOKEN missing::Add a fine-grained PAT with contents:write on dogfood-lab/testing-os as the secret DOGFOOD_TOKEN. The dispatch cannot run without it."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Produce scenario-results.json — an array of scenario_result objects.
      # Replace this with whatever turns YOUR test output into that shape; see
      # scenario-results.example.json in this folder for the contract.
      - name: Build scenario results
        run: |
          # e.g. node scripts/to-dogfood-scenarios.mjs > scenario-results.json
          # dogfood-init scaffolds scenario-results.example.json into your repo
          # ROOT; this starter copies it so the workflow runs end-to-end on the
          # first push. Replace it with your real test-output transform.
          cp scenario-results.example.json scenario-results.json

      # Build the submission envelope. dogfood-report reads repo / commit /
      # run-id / run-url / actor from the standard GITHUB_* env vars, so you only
      # supply the scenario file and the verdict. --precheck runs the SAME schema
      # validation the receiver will, so a malformed envelope fails here, not
      # after a wasted dispatch.
      - name: Build submission
        run: |
          npx --yes @dogfood-lab/report \
            --scenario-file scenario-results.json \
            --verdict pass \
            --precheck \
            --output submission.json

      # Dispatch to testing-os. No third-party action — gh api is built in.
      - name: Dispatch to testing-os
        env:
          GH_TOKEN: ${{ secrets.DOGFOOD_TOKEN }}
        run: |
          jq -n --slurpfile s submission.json \
            '{event_type: "dogfood_submission", client_payload: {submission: $s[0]}}' \
            | gh api repos/dogfood-lab/testing-os/dispatches --input -
          echo "Dispatched. Watch ingest: https://github.com/dogfood-lab/testing-os/actions/workflows/ingest.yml"

      # Confirm the dispatch actually landed. The dispatch above is fire-and-forget:
      # the receiver ingests ASYNCHRONOUSLY, so this step is BEST-EFFORT — a fresh
      # record may not be served yet when it runs, hence `continue-on-error`. It
      # reads the receiver's PUBLIC served index (no auth) and reports whether THIS
      # repo's latest run is recorded, accepted, and fresh. Promote it to a hard
      # gate (drop continue-on-error) once your cadence makes a same-run record
      # reliably present — then a silent non-record turns your CI red.
      - name: Confirm dispatch landed (best-effort)
        continue-on-error: true
        run: |
          npx --yes @dogfood-lab/report --status --repo "${GITHUB_REPOSITORY}"

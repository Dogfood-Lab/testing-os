# policy.example.yaml — a starter repo policy for testing-os.
#
# A repo policy declares what "verified" means for YOUR repo: which surfaces you
# dogfood, how fresh evidence must be, and which gates are enforced vs advisory.
# It lives in the testing-os repo at policies/repos/<org>/<repo>.yaml — open a PR
# to add yours, or start from this file. Validate it before it goes live with the
# verify CLI: `npx @dogfood-lab/verify --file <a submission> --explain`.
#
# The global rules below (schema-valid, provenance-confirmed, scenario-minimum,
# step-results-present, step-verdict-consistent, attested-if-human) are enforced
# for every repo and are documented here for reference — you do not re-declare
# them; you tune the defaults and add repo-specific rules.

policy_version: "1.0.0"

defaults:
  freshness:
    # Evidence older than max_age_days reads as "stale" in the indexes;
    # warn_age_days is the soft warning band before that.
    max_age_days: 30
    warn_age_days: 14
  execution_mode_policy:
    # Who may produce evidence: bot (CI), human (attested), or mixed.
    allowed: [bot, human, mixed]
  ci_requirements:
    coverage_min: null          # e.g. 80 to require >=80% coverage evidence
    tests_must_pass: true
  evidence_requirements:
    required_kinds: []           # e.g. [log, screenshot] to require both
    min_evidence_count: 1

# Repo-specific rules (optional). Each has an id, a description, and a severity:
#   reject  — a violation fails verification (the submission is rejected)
#   warn    — recorded but does not fail
# Global rules (schema-valid, provenance-confirmed, scenario-minimum, ...) are
# always on; these are additive.
rules: []

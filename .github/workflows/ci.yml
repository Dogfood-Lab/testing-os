name: CI

on:
  push:
    paths:
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - 'tsconfig.json'
      - '.github/workflows/**'
      # Doc-drift gate (wave 19, Class #11 sweep pattern): any change to a
      # source-of-truth file (errors.js, schema.js) or to a doc surface
      # (docs/, site/, PROTOCOL.md) re-runs scripts/check-doc-drift.mjs so
      # spec drift fails CI in one place rather than rotting silently.
      - 'docs/**'
      - 'site/**'
      - 'swarms/PROTOCOL.md'
      - 'scripts/**'
      # VERIFY-F3: policy files are gated by scripts/lint-policies.test.mjs (run via
      # test:scripts). A policy-only edit must trigger CI so the lint runs on the exact
      # files it guards — mirrors the d6-infra-001 honesty-surface trigger reasoning below.
      - 'policies/**'
      # d6-infra-001: the honesty surfaces the doc-drift gates exist to
      # protect. sync-version:check reads README.md; the R9
      # source-of-truth-cross-ref handler cross-checks SHIP_GATE.md /
      # SCORECARD.md / CLAUDE.md / README.md version+state claims; and the
      # schema-conformance check validates swarms/__schema-fixtures__/*.json.
      # Without these, a commit editing ONLY a root honesty surface or ONLY a
      # fixture (a common operation — re-affirming a date, fixing a status
      # line, editing a negative fixture) triggered no CI run, so the gate
      # built to catch drift was bypassed at the trigger level for the exact
      # files it guards. These steps already run; this closes the trigger gap.
      - 'README.md'
      - 'SHIP_GATE.md'
      - 'SCORECARD.md'
      - 'CLAUDE.md'
      - 'HANDOFF.md'
      - 'swarms/__schema-fixtures__/**'
      # F-CI-001 (amended by F-5d126106): this used to list
      # 'swarms/swarm-*/wave-*/outputs/**' so a push touching ONLY live-run
      # wave outputs would still trigger the agent-output-schema conformance
      # gate. That trigger was DEAD from the day it was added:
      # swarms/.gitignore ignores `swarm-*/` wholesale, so a push can never
      # touch a path under swarms/swarm-*/ in the first place
      # (`git ls-files 'swarms/swarm-*'` returns zero tracked files, ever) —
      # the filter could never fire, and the comment it shipped with
      # claimed CI coverage the config could not structurally deliver. The
      # live-run tree IS real and IS schema-checked, but only LOCALLY via
      # `npm run verify` (scripts/doc-drift-patterns.json's
      # agent-output-schema check still carries the live-run glob in its
      # `targets`, now marked `allowEmptyGlobs` so zero matches on CI reads
      # as correct rather than config-error). Removed the dead trigger
      # rather than leave a comment asserting coverage that does not exist;
      # the COMMITTED fixtures under swarms/__schema-fixtures__/ are a
      # separate, real path already covered by the dedicated
      # 'swarms/__schema-fixtures__/**' trigger above (d6-infra-001) — that
      # trigger is unaffected by this removal.
      # F-362d4131: runtime data dirs the test suite reads as REAL fixtures
      # (CLAUDE.md rule 6 — no mocks). setupTestRoot() copies from fixtures/;
      # dogfood/scenarios/*.test.mjs (run via test:scripts) validates dogfood/.
      # A fixture-only or scenario-only commit must run CI, else a reshape that
      # breaks the ingest/verify suite lands green-by-absence (same trigger-gap
      # class as d6-infra-001). Guarded by
      # scripts/stageA-check-ci-honesty-paths.test.mjs.
      - 'fixtures/**'
      - 'dogfood/**'
  pull_request:
    paths:
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - 'tsconfig.json'
      - '.github/workflows/**'
      - 'docs/**'
      - 'site/**'
      - 'swarms/PROTOCOL.md'
      - 'scripts/**'
      # VERIFY-F3: policy files gated by scripts/lint-policies.test.mjs (see push block above).
      - 'policies/**'
      # d6-infra-001: honesty surfaces + schema fixtures (see push block above).
      - 'README.md'
      - 'SHIP_GATE.md'
      - 'SCORECARD.md'
      - 'CLAUDE.md'
      - 'HANDOFF.md'
      - 'swarms/__schema-fixtures__/**'
      # F-CI-001 (amended by F-5d126106): dead 'swarms/swarm-*/wave-*/outputs/**'
      # trigger removed — swarms/.gitignore ignores `swarm-*/` wholesale, so
      # this path could never be touched by a push or a PR (see push block
      # above for the full rationale).
      # F-362d4131: runtime fixture/scenario data dirs (see push block above).
      - 'fixtures/**'
      - 'dogfood/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# F-W1-CI-002: declare the minimum the workflow needs explicitly rather than
# inheriting whatever repo-default GITHUB_TOKEN scope is configured. The CI
# workflow runs untrusted PR code via `npm ci` + `npm test`, so the
# GITHUB_TOKEN scope is part of the attack surface. `contents: read` is the
# floor needed for `actions/checkout` to fetch the ref; no job here writes
# back to the repo, so no per-job override is needed.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Both Node legs must run to completion so the operator can tell from a
      # single CI run whether a failure is Node-version-specific (e.g. an
      # assert.throws matcher tightened in one runtime) or a real cross-
      # version bug. Default fail-fast: true cancels one leg mid-flight when
      # the other fails and costs an extra retry-and-pin cycle every time.
      # F-33ff7b4b: phrased version-agnostically on purpose — a prior version
      # of this comment named a specific pair (22 vs 20) and went stale the
      # moment F-W1-CI-010 (a few lines below) dropped 20 from the matrix,
      # self-contradicting within the same strategy: block. Naming no
      # version here means the next matrix move can't repeat that drift.
      fail-fast: false
      matrix:
        # F-W1-CI-010: Node 20 hit EOL on 2026-04-30 — drop. Node 22 is
        # current Maintenance LTS, Node 24 is Active LTS. Bumping the matrix
        # surfaces Node 24 native-test-runner / permission-model / fetch
        # behavior drift before downstream consumers hit it. The setup-node
        # SHA bump (separate baseline issue, deadline 2026-09-16) is a
        # follow-up that does not gate this matrix change.
        #
        # 2026-05-14 cleanup: `engines.node` lockstep-tightened from `>=20`
        # to `>=22` to match this matrix + better-sqlite3 v12 prebuild
        # support (v12 dropped Node 20 prebuilds — consumers on Node 20
        # would have needed a C++ toolchain to install). Honest signal
        # beats permissive engines-with-no-test-coverage.
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6.0.3 (node24 runtime)
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      # Gate: package.json, package-lock.json (top-level + packages.""), and
      # README must all agree on the workspace version. Catches the F-178611-015
      # drift class (lockfile stamped from a prior version) before tests run.
      - run: npm run sync-version:check
      # H10 / Wave A1 amend: durable lockfile-drift guard. `npm install --package-lock-only`
      # regenerates the lockfile from package.json + the workspace tree without
      # touching node_modules; the follow-up `git diff --exit-code` fails CI on
      # ANY lockfile drift class (version, engines.node, transitive deps, new
      # workspace, deleted workspace). This is strictly broader than
      # sync-version:check, which only inspects two version fields — at HEAD
      # d0f7a58 the lockfile shipped with all 7 packages/* entries pinned at
      # 1.2.2 (root was 1.2.3) and engines.node at >=20 (root was >=22), and
      # sync-version:check passed despite both classes of drift.
      #
      # Stage C Wave A2 D4B-001 / D4B-002 (humanization — operator-legible
      # failures):
      #
      # D4B-001 — split install vs diff so a registry timeout (transient
      # network) does NOT look identical to real lockfile drift. The
      # previous one-shot `npm install --package-lock-only && git diff` made
      # an operator chase a phantom diff on red CI every time the upstream
      # registry hiccuped. The install step writes its log to install.log;
      # if it fails we inspect for the canonical network-error fingerprints
      # (ETIMEDOUT/ECONNRESET/ENETUNREACH/registry.npmjs.org HTTP 5xx) and
      # emit a ::warning:: so the leg passes but the operator knows the
      # gate was skipped (versus an ::error:: + non-zero exit on any other
      # install failure).
      #
      # D4B-002 — pin the lockfile-drift gate to ONE Node version (the
      # lower one in the matrix, 22) instead of running on every matrix
      # leg. The lockfile is normative regardless of which Node version
      # produced it; running it once is sufficient. Running on both legs
      # opened a phantom-drift class: npm 10.9 vs npm 11.x produce subtly
      # different lockfile shape (sorted-keys, integrity-hash format),
      # which a 24-leg can write but a 22-leg can't and vice versa. The
      # `if:` condition gates the install + diff steps to the 22 leg only.
      #
      # FT-a (Dependabot compatibility) — skip the regenerate-and-diff drift
      # check on Dependabot PRs. The gate runs `npm install --package-lock-only`
      # and diffs the result, which is a FULL lockfile regeneration. Dependabot
      # commits a lockfile that it derived from a targeted single-dependency
      # bump; a full regeneration on a different npm minor (or with transitive
      # deps that resolved differently at PR-open time vs CI-run time) does not
      # reproduce Dependabot's committed lockfile byte-for-byte, so the diff is
      # non-empty and the gate fails every Dependabot npm PR (confirmed on PR
      # #40). Dependabot already commits an internally-consistent lockfile —
      # `npm ci` in the `npm ci` step above is the real consistency check for
      # those PRs (it fails if package.json and the lockfile disagree). So we
      # gate the destructive regenerate-and-diff to non-Dependabot actors.
      # `github.actor` is the user that triggered the run; on a Dependabot PR it
      # is `dependabot[bot]`. We also check `github.event.pull_request.user.login`
      # so the skip holds when the workflow is re-run manually by a human (which
      # changes github.actor) on a Dependabot-authored PR.
      - name: Lockfile-drift gate — install (Node 22, non-Dependabot only; D4B-002 + FT-a)
        if: ${{ matrix.node-version == 22 && github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]' }}
        id: lockfile_install
        run: |
          set +e
          npm install --package-lock-only --no-audit --no-fund 2> install.log
          install_exit=$?
          set -e
          if [ $install_exit -ne 0 ]; then
            # D4B-001: classify the failure. Network-class failures get a
            # warning + a non-blocking skip; everything else is a hard
            # error so an operator never confuses "lockfile mismatch" with
            # "registry was down".
            if grep -E -i "ETIMEDOUT|ECONNRESET|ENETUNREACH|ENOTFOUND|EAI_AGAIN|socket hang up|network timeout|registry\.npmjs\.org.*5[0-9][0-9]|ERR_SOCKET_TIMEOUT" install.log >/dev/null 2>&1; then
              echo "::warning::lockfile-drift gate skipped: 'npm install --package-lock-only' hit a transient network error. Lockfile NOT checked this run. Re-run if a drift was actually expected."
              echo "skipped=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::lockfile-drift gate failed: 'npm install --package-lock-only' exited non-zero with a non-network error. Install log:"
            cat install.log
            exit 1
          fi
          echo "skipped=false" >> "$GITHUB_OUTPUT"
      # FT-a: the diff step is naturally gated on the install step having run —
      # `steps.lockfile_install.outputs.skipped` is only ever 'false' when the
      # install step executed, and a step skipped by its own `if:` produces an
      # empty (falsy) outputs object, so `!= 'true'` is satisfied. To be
      # explicit (and robust if someone later flips the install default), repeat
      # the Dependabot guard here so the diff cannot run on a Dependabot PR even
      # if the install step's condition is edited independently.
      - name: Lockfile-drift gate — diff (Node 22, non-Dependabot only; D4B-002 + FT-a)
        if: ${{ matrix.node-version == 22 && github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]' && steps.lockfile_install.outputs.skipped != 'true' }}
        run: |
          git diff --exit-code package-lock.json || {
            echo "::error::package-lock.json drifted from package.json. Run 'npm install' locally and commit the regenerated lockfile. (This failure is a REAL lockfile mismatch — the install step succeeded, so no transient-network suspicion.)"
            exit 1
          }
      # Class #11 sweep gate: assert source-of-truth/doc cross-refs hold.
      # Catches the F-COORD-004 drift class (error code added to lib/errors.js
      # without a sibling entry in error-codes.md, status enum added to
      # schema.js without state-machines.md mention, legacy paths leaking back
      # into user-facing handbook pages). See scripts/doc-drift-patterns.json
      # for the active checks; adding a new instance is a config edit.
      - run: npm run check-doc-drift
      # VD-NEW-2 (Phase 2-B verification-discipline): `npm run verify` runs
      # check-regression-pins as the third gate; CI was missing it. The local
      # vs. CI chain drift meant an operator who relied on green CI to bless a
      # push could land a regression-pin drift that local pre-commit would
      # have caught. scripts/check-finding-regression-pins.mjs.
      - run: npm run check-regression-pins
      # Phase 10 release-prep fix-up (post-H3): `test:scripts` historically
      # ran BEFORE `build`, which was safe back when every scripts/*.test.mjs
      # was a pure-JS script with no workspace dependencies. The new
      # D2B-015 invariant test (scripts/check-validator-cache-singleton.test.mjs,
      # landed with H3) imports `@dogfood-lab/schemas` to assert the
      # single-cache invariant across consumers — and that import needs
      # the TypeScript schemas package built to `dist/` first. Reorder so
      # `build` runs before `test:scripts`. The package.json `verify` script
      # mirrors this order.
      - run: npm run build
      - run: npm run test:scripts
      - run: npm test

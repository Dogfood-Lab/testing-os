# self-dogfood.yml — testing-os dogfoods ITSELF (F-CI-SELF-DOGFOOD-001)
#
# This is the FIFTH workflow in this repo. CLAUDE.md ("adding a fifth workflow
# needs explicit justification") — the justification is self-dogfooding: the
# evidence platform must prove its own gate through its own pipeline. After CI
# completes, this packages the REAL CI conclusion into a dogfood submission
# ABOUT testing-os and dispatches it to testing-os's OWN ingest.yml. It is the
# consumer template (examples/dogfood.yml) turned inward. Structural pins live
# in scripts/self-dogfood-workflow.test.mjs.
#
# ── AUTH: the workflow's own GITHUB_TOKEN — no PAT, no secret ────────────────
# GitHub's recursive-workflow prevention has a DOCUMENTED exception: events
# created with the workflow's GITHUB_TOKEN do not start new workflow runs,
# "with the exception of workflow_dispatch and repository_dispatch"
# (docs: "Triggering a workflow from a workflow"). Same-repo repository_dispatch
# is therefore the officially supported chaining path, and this workflow uses
# it: job-scoped `contents: write` on the auto-rotating GITHUB_TOKEN, nothing
# long-lived to mint, rotate, or 401/403. An earlier revision required a
# consumer-style PAT here on the mistaken belief the exception did not exist;
# two rounds of fine-grained-PAT 403s later, this is the corrected design.
# CONSUMER repos still need a PAT (examples/dogfood.yml) — theirs is a
# CROSS-repo dispatch, which no workflow-local token can perform.
# ─────────────────────────────────────────────────────────────────────────────

name: self-dogfood

on:
  # Primary: run after this repo's own CI workflow completes, so the submitted
  # verdict reflects the REAL gate result. Manual fallback for re-fires.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: self-dogfood-${{ github.ref }}
  cancel-in-progress: true

# contents: write is required by POST /repos/{owner}/{repo}/dispatches — the
# same permission the fine-grained-PAT design needed, now carried by the
# job-scoped auto-expiring GITHUB_TOKEN instead of a long-lived secret. This
# workflow never pushes; the write scope exists solely for the dispatch API.
permissions:
  contents: write

jobs:
  self-dogfood:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Loop-safety guard (belt-and-braces). ingest.yml commits records/+indexes/
    # with an `ingest: ...` subject. That commit does NOT match ci.yml's paths
    # filter, so no CI run fires off it and no loop exists today — but if a future
    # ci.yml paths edit ever caught records/ or indexes/, an ingest commit could
    # trigger CI → this workflow → another ingest → ... . Skip any workflow_run
    # triggered by an ingest commit, and gate the workflow_run leg to main.
    #
    # Conclusion gate (honesty): only a CONCLUSIVE CI result is evidence about
    # this repo's gate. Proceed for success (→ pass) and failure (→ fail) only.
    # A `cancelled` run (cancel-in-progress superseded by a newer push), a
    # `skipped` run (paths filter), or any other conclusion is NOT a gate
    # outcome — the job is skipped rather than submit a FALSE `fail` record about
    # testing-os. workflow_dispatch (manual re-fire) is always allowed through and
    # asserts the current state (no triggering run → conclusion treated as pass).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.head_branch == 'main' &&
       !startsWith(github.event.workflow_run.head_commit.message, 'ingest:') &&
       (github.event.workflow_run.conclusion == 'success' ||
        github.event.workflow_run.conclusion == 'failure'))
    steps:
      # No token preflight: the dispatch authenticates with the workflow's own
      # GITHUB_TOKEN (see header), which always exists. A permission regression
      # (someone narrowing the permissions block) fails loud at the Dispatch
      # step itself with the API's 403 — same honest signal, zero setup.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6.0.3 (node24 runtime)

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      # Install deps + build so the submission is produced by the LOCAL report
      # CLI (packages/report/cli.js) against THIS commit's code — the honest
      # self-dogfood. An earlier version shelled out to the PUBLISHED
      # @dogfood-lab/report package (npm-exec) from $RUNNER_TEMP, but that both
      # (1) tested a published artifact that can lag the commit CI just gated, and
      # (2) silently produced no submission.json — from the repo root the package
      # name resolves to this monorepo's own uninstalled workspace package and
      # no-ops. `npm ci` provides the @dogfood-lab/* workspace symlinks the local
      # CLI resolves through; `npm run build` produces @dogfood-lab/schemas' dist/,
      # which the local --precheck path (precheckSubmission -> validatePayload)
      # requires.
      - name: Install and build
        run: |
          npm ci
          npm run build

      # Build scenario-results.json for the committed self-verify-gate scenario
      # from the REAL CI conclusion. NEVER hardcode passes: a green CI run submits
      # every step pass; a red one submits verdict: fail with every step fail. An
      # evidence platform that only reports its wins is worthless. The array holds
      # ONE scenario_result whose step_results cover ALL SIX declared step ids, so
      # the receiver's required-steps enforcement (against
      # dogfood/scenarios/self-verify-gate.yaml) passes. On workflow_dispatch
      # there is no triggering run, so treat a missing conclusion as success
      # (a human re-firing the manual fallback is asserting the current state).
      - name: Build scenario results from CI conclusion
        env:
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          CI_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          node <<'NODE' > scenario-results.json
          const conclusion = process.env.CI_CONCLUSION || 'success';
          const runUrl = process.env.CI_RUN_URL
            || `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
          const verdict = conclusion === 'success' ? 'pass' : 'fail';
          const status = verdict; // per-step status mirrors the gate outcome
          const stepIds = [
            'version-sync-gate',
            'doc-drift-gate',
            'regression-pins-gate',
            'build',
            'scripts-suite',
            'workspace-suites',
          ];
          const result = [{
            scenario_id: 'self-verify-gate',
            scenario_name: 'testing-os self-verification gate',
            scenario_version: '1.0.0',
            product_surface: 'cli',
            execution_mode: 'bot',
            verdict,
            notes: `Derived from the testing-os CI workflow_run conclusion: ${conclusion}.`,
            step_results: stepIds.map((step_id) => ({ step_id, status })),
            evidence: [{
              kind: 'log',
              description: 'The testing-os CI workflow_run log for the commit under test',
              url: runUrl,
            }],
          }];
          process.stdout.write(JSON.stringify(result, null, 2) + '\n');
          NODE
          echo "Built scenario-results.json for CI conclusion: ${CI_CONCLUSION:-success}"

      # Build the submission envelope with the shipped report CLI. It reads
      # repo / commit / run-id / run-url / actor from the standard GITHUB_* env
      # vars; we supply only the scenario file and the derived verdict. --precheck
      # runs the SAME schema validation the receiver will, so a malformed envelope
      # fails HERE, in-workflow, not after a wasted dispatch.
      - name: Build submission
        env:
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          CI_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_RUN_URL: ${{ github.event.workflow_run.html_url }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if [ "${CI_CONCLUSION:-success}" = "success" ]; then
            VERDICT=pass
          else
            VERDICT=fail
          fi
          # The submission is evidence ABOUT the commit CI actually gated. Under a
          # workflow_run event $GITHUB_SHA is the DEFAULT-BRANCH head, NOT the
          # tested commit — so pin --commit to workflow_run.head_sha, and point
          # source.run_url / provider_run_id at the CI run that produced the
          # verdict. All three fall back to this run's own env on workflow_dispatch
          # (manual re-fire), which has no triggering workflow_run.
          COMMIT="${CI_HEAD_SHA:-$GITHUB_SHA}"
          RUN_URL="${CI_RUN_URL:-https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID}"
          PROVIDER_RUN_ID="${CI_RUN_ID:-$GITHUB_RUN_ID}"
          # Build with the LOCAL CLI: self-contained, and it exercises THIS commit's
          # builder rather than a published artifact. --precheck runs the SAME
          # schema validation the receiver will, so a malformed envelope fails HERE,
          # in-workflow, not after a wasted dispatch. Output goes to submission.json
          # in $GITHUB_WORKSPACE — the same relative path the Dispatch step slurps
          # below (every step shares that working directory).
          node packages/report/cli.js \
            --scenario-file scenario-results.json \
            --commit "$COMMIT" \
            --run-url "$RUN_URL" \
            --provider-run-id "$PROVIDER_RUN_ID" \
            --workflow CI \
            --verdict "$VERDICT" \
            --precheck \
            --output submission.json

      # Dispatch to testing-os ITSELF (self-submission) using the workflow's own
      # GITHUB_TOKEN via the documented same-repo repository_dispatch exception
      # (see header) — no PAT, no secret. No third-party action: gh api is built in.
      - name: Dispatch to testing-os (self)
        # Same-repo repository_dispatch with the workflow's own token — the
        # documented recursion-prevention exception (see header). Cross-repo
        # consumers cannot do this; their template keeps the consumer PAT secret.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -n --slurpfile s submission.json \
            '{event_type: "dogfood_submission", client_payload: {submission: $s[0]}}' \
            | gh api repos/dogfood-lab/testing-os/dispatches --input -
          echo "Dispatched self-submission. Watch ingest: https://github.com/dogfood-lab/testing-os/actions/workflows/ingest.yml"

      # Confirm the dispatch landed. Best-effort: the receiver ingests
      # ASYNCHRONOUSLY, so a fresh record may not be served yet when this runs
      # (hence continue-on-error). Reads the receiver's PUBLIC served index
      # (no auth) and reports whether this repo's latest run is recorded.
      - name: Confirm dispatch landed (best-effort)
        continue-on-error: true
        # Local CLI again (self-contained). --status reads the receiver's PUBLIC
        # served index over the network — no auth — and is best-effort because the
        # receiver ingests ASYNCHRONOUSLY: a fresh record may not be served yet
        # when this runs (hence continue-on-error).
        run: node packages/report/cli.js --status --repo "${GITHUB_REPOSITORY}"

name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    # F-W1-CI-011: `branches: [main]` on the push trigger does NOT apply to
    # workflow_dispatch — that's a common misreading. workflow_dispatch can
    # run on any branch where the workflow file exists. Guard the build job
    # so a workflow_dispatch caller against a non-main branch can't push
    # a malicious site/ change and consume Actions minutes (or, worse,
    # produce an artifact the deploy job consumes). Push-trigger paths are
    # already main-only; the guard adds nothing to that leg.
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Build site
        working-directory: site
        run: npm run build

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Verify deployed site returns 200
        id: verify
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          if [ -z "$url" ]; then
            echo "::error::deploy-pages did not emit a page_url output"
            exit 1
          fi
          echo "Probing $url"
          for attempt in 1 2 3 4 5; do
            # -L follows redirects (308 trailing-slash enforcement, custom-domain
            # redirects); %{url_effective} surfaces the final URL in the log so a
            # real redirect chain is debuggable without re-running locally. Any
            # 2xx counts as success.
            response=$(curl -sSL -o /dev/null -w "%{http_code} %{url_effective}" --max-time 15 "$url" || echo "000 -")
            status=$(echo "$response" | awk '{print $1}')
            final_url=$(echo "$response" | awk '{print $2}')
            echo "attempt $attempt: HTTP $status (final: $final_url)"
            case "$status" in
              2*)
                echo "::notice::Pages deploy verified ($url -> $final_url returned $status)"
                echo "page_url=$url" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
            sleep $((attempt * 5))
          done
          echo "::error::Pages deploy verification failed — $url never returned 2xx"
          exit 1

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: pa11y accessibility check (WCAG2AA, error-codes handbook page)
        # Stage D minimum visual regression CI gate (F-827321-030 / D-OUT-003):
        # Run pa11y against ONE high-value reference page after the deploy has
        # been verified. WCAG2AA is the bar; we fail on errors, ignore warnings
        # and notices. Pinned to an exact version (NOT a floating caret-major
        # tag) because pa11y embeds puppeteer + chromium and the workflow runs
        # under `pages: write` + `id-token: write`. F-W1-CI-001: a supply-chain
        # compromise of pa11y or any transitive dep would execute with
        # elevated permissions during every Pages deploy. There is no
        # consumer in the workspace that needs a lockfile entry, and adding
        # one to root devDependencies would pull the chromium-puppeteer chain
        # into every `npm ci` for a check that only ever runs in this
        # workflow leg. If we ever sweep multiple pages we'll revisit and
        # pin via site/package-lock.json. Bump in lockstep with Dependabot
        # github-actions / npm sweeps.
        #
        # Chromium sandbox shim: GitHub Actions ubuntu-latest runners disable
        # the SUID sandbox by default, so puppeteer (which pa11y embeds) fails
        # to launch chrome without `--no-sandbox`. The fix lives inline as a
        # minimal config written to /tmp at run time — NOT a checked-in
        # .pa11yrc.json, because the only reason the file exists is the GHA
        # runner kernel constraint, not a tested-against config we want to
        # commit. Same "no Cadillac" discipline as the original pa11y wiring.
        run: |
          target="${{ steps.verify.outputs.page_url }}handbook/error-codes/"
          echo "pa11y target: $target"
          cat > /tmp/pa11y-ci.json <<'EOF'
          {
            "chromeLaunchConfig": {
              "args": ["--no-sandbox", "--disable-setuid-sandbox"]
            }
          }
          EOF
          npx -y pa11y@9.1.1 \
            --standard WCAG2AA \
            --reporter cli \
            --threshold 0 \
            --config /tmp/pa11y-ci.json \
            "$target"

name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    # F-W1-CI-011: `branches: [main]` on the push trigger does NOT apply to
    # workflow_dispatch — that's a common misreading. workflow_dispatch can
    # run on any branch where the workflow file exists. Guard the build job
    # so a workflow_dispatch caller against a non-main branch can't push
    # a malicious site/ change and consume Actions minutes (or, worse,
    # produce an artifact the deploy job consumes). Push-trigger paths are
    # already main-only; the guard adds nothing to that leg.
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3 (node24 runtime)

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          # F-d31dfc55: runtime pin — keep in lockstep with the ci.yml node
          # matrix (source of truth, currently [22, 24]; see ci.yml
          # `node-version: [22, 24]`). Pinned to the lower LTS for the site
          # build; bump only when the ci.yml matrix floor moves.
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Accent reconciliation gate (D-DOCS-003 / F-e4a24655)
        # scripts/check-accent-color.test.mjs's landing-side half reads
        # site/node_modules/@mcptoolshop/site-theme/styles/theme.css — a file
        # that only exists after `npm ci` in site/. ci.yml runs test:scripts
        # after the ROOT npm ci only, so there the landing-side check skips
        # (visibly, via t.skip). This is the one CI location where the dep is
        # guaranteed installed, so the two-palette regression the test exists
        # to prevent (landing green vs handbook blue) is actually gated here.
        run: node --test scripts/check-accent-color.test.mjs

      - name: Build site
        working-directory: site
        run: npm run build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # F-a52776d5: expose the verified URL so the pa11y job below can probe it
    # WITHOUT inheriting this job's `pages: write` + `id-token: write` scope.
    # The verify step only writes page_url on a 2xx probe, so the a11y job
    # (needs: deploy) never runs against an unverified deploy.
    outputs:
      page_url: ${{ steps.verify.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Verify deployed site returns 200
        id: verify
        # F-bc123f41: env-hoist rather than inline-interpolate — the same
        # CWE-78 discipline the a11y step below and ingest.yml follow. The
        # value comes from GitHub's own deploy-pages action so it is trusted
        # today; the hoist keeps this file demonstrating exactly ONE pattern
        # for expression values reaching a shell body, so the unhardened form
        # can't be copy-pasted into a step where the value IS attacker-influenced.
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          url="$PAGE_URL"
          if [ -z "$url" ]; then
            echo "::error::deploy-pages did not emit a page_url output"
            exit 1
          fi
          echo "Probing $url"
          for attempt in 1 2 3 4 5; do
            # -L follows redirects (308 trailing-slash enforcement, custom-domain
            # redirects); %{url_effective} surfaces the final URL in the log so a
            # real redirect chain is debuggable without re-running locally. Any
            # 2xx counts as success.
            response=$(curl -sSL -o /dev/null -w "%{http_code} %{url_effective}" --max-time 15 "$url" || echo "000 -")
            status=$(echo "$response" | awk '{print $1}')
            final_url=$(echo "$response" | awk '{print $2}')
            echo "attempt $attempt: HTTP $status (final: $final_url)"
            case "$status" in
              2*)
                echo "::notice::Pages deploy verified ($url -> $final_url returned $status)"
                echo "page_url=$url" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
            sleep $((attempt * 5))
          done
          echo "::error::Pages deploy verification failed — $url never returned 2xx"
          exit 1

  a11y:
    # F-a52776d5: pa11y runs `npx -y pa11y@9.1.1`, whose transitive
    # puppeteer/chromium chain installs unpinned at run time with no lockfile
    # (the F-W1-CI-001 trade-off below). It used to run INSIDE the deploy job,
    # so a supply-chain compromise would have executed under `pages: write` +
    # `id-token: write`. GitHub permissions are job-scoped: this job needs
    # only network access to the already-deployed public URL, so it runs with
    # an explicitly EMPTY token scope — a pa11y-chain compromise executes with
    # a permissionless token. The no-lockfile trade-off itself is unchanged.
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: {}
    steps:
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: pa11y accessibility check (WCAG2AA, multiple handbook pages with retry)
        # Stage D visual regression CI gate (F-827321-030 / D-OUT-003, Stage D
        # amend FX5 + FX6): run pa11y against a curated set of high-value
        # reference pages after the deploy has been verified. WCAG2AA is the
        # bar; we fail on errors, ignore warnings and notices. Pinned to an
        # exact version (NOT a floating caret-major tag) because pa11y embeds
        # puppeteer + chromium. F-W1-CI-001: this step USED to run inside the
        # deploy job under `pages: write` + `id-token: write`, where a
        # supply-chain compromise of pa11y or any transitive dep would have
        # executed with elevated permissions during every Pages deploy — the
        # F-a52776d5 restructure (see the job-level comment above) moved it
        # into this permissionless job, so a compromise now executes with an
        # empty token. The exact-version pin stays: it still bounds what code
        # runs at all. There is no consumer in the workspace that needs a
        # lockfile entry, and adding one to root devDependencies would pull
        # the chromium-puppeteer chain into every `npm ci` for a check that
        # only ever runs in this workflow leg. Bump in lockstep with
        # Dependabot github-actions / npm sweeps.
        #
        # Stage D amend FX5 (D4B-015 closure): wrap each per-page pa11y
        # invocation in a 3-attempt retry-with-backoff. Pre-amend the step
        # ran once and any transient chromium-mirror blip during the `npx
        # -y` install broke an otherwise-successful deploy. The deploy job's
        # 'Verify deployed site returns 200' step already used a 5-attempt
        # loop; this asymmetry was the audit finding. Three attempts is enough:
        # real accessibility regressions are deterministic and re-fail;
        # only transient network/install errors recover. Backoff factor 10
        # (vs verify's 5) because pa11y's failure mode is install timeout,
        # which often needs longer than HTTP 5xx recovery.
        #
        # Stage D amend FX6 (MED-3 closure): broaden coverage beyond the
        # single error-codes/ canary. The audit flagged that 13 of 14
        # deployed pages had no a11y gate — error-codes is high-signal
        # because of its severity callouts + WCAG-AA accent assertion in
        # scripts/check-severity-contrast.test.mjs, but the architecture,
        # state-machines, and cli-reference pages have orthogonal a11y
        # surface area (figure+caption alt text, complex tables, dense
        # code blocks). The current sweep runs 4 pages serially — same
        # `npx -y` install reused across attempts via the npm cache, so
        # the wall-clock overhead is modest. If pa11y churn becomes a
        # maintenance burden, the future state is promotion to
        # site/package-lock.json (acknowledged in the original comment).
        #
        # Chromium sandbox shim: GitHub Actions ubuntu-latest runners disable
        # the SUID sandbox by default, so puppeteer (which pa11y embeds) fails
        # to launch chrome without `--no-sandbox`. The fix lives inline as a
        # minimal config written to /tmp at run time — NOT a checked-in
        # .pa11yrc.json, because the only reason the file exists is the GHA
        # runner kernel constraint, not a tested-against config we want to
        # commit. Same "no Cadillac" discipline as the original pa11y wiring.
        # CWE-78 discipline (matching ingest.yml): hoist the cross-job output
        # into env rather than interpolating ${{ }} inline into the shell body.
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          base="$PAGE_URL"
          if [ -z "$base" ]; then
            echo "::error::deploy job produced no page_url output — the a11y job cannot probe an unknown URL. Check the deploy job's verify step."
            exit 1
          fi
          # Pages probed for WCAG2AA compliance. Curated, not glob-swept, so
          # adding a new page is an explicit decision (not a silent regression
          # on a new untested page). Update this list when a new high-value
          # reference page lands in site/src/content/docs/handbook/.
          targets=(
            "${base}handbook/error-codes/"
            "${base}handbook/architecture/"
            "${base}handbook/state-machines/"
            "${base}handbook/cli-reference/"
            "${base}dashboard/"
          )

          cat > /tmp/pa11y-ci.json <<'EOF'
          {
            "chromeLaunchConfig": {
              "args": ["--no-sandbox", "--disable-setuid-sandbox"]
            }
          }
          EOF

          failures=()
          for target in "${targets[@]}"; do
            echo ""
            echo "::group::pa11y → $target"
            ok=0
            for attempt in 1 2 3; do
              if npx -y pa11y@9.1.1 \
                  --standard WCAG2AA \
                  --reporter cli \
                  --threshold 0 \
                  --config /tmp/pa11y-ci.json \
                  "$target"; then
                ok=1
                echo "pa11y OK on attempt $attempt: $target"
                break
              fi
              if [ $attempt -lt 3 ]; then
                wait_s=$((attempt * 10))
                echo "::warning::pa11y attempt $attempt failed for $target — sleeping ${wait_s}s before retry"
                sleep $wait_s
              fi
            done
            if [ $ok -eq 0 ]; then
              failures+=("$target")
            fi
            echo "::endgroup::"
          done

          if [ ${#failures[@]} -gt 0 ]; then
            echo "::error::pa11y failed on ${#failures[@]} page(s) after 3 attempts each:"
            for f in "${failures[@]}"; do
              echo "::error::  $f"
            done
            exit 1
          fi
          echo "::notice::pa11y WCAG2AA OK across ${#targets[@]} handbook pages"

name: Release

# Publishes the 6 public @dogfood-lab/* packages to npm using OIDC trusted
# publishing. No NPM_TOKEN required — npm validates the workflow's OIDC
# subject claim against the trust config in npmjs.com (configured for
# dogfood-lab/testing-os + release.yml). The published tarballs include
# Sigstore provenance via --provenance.
#
# Two triggers:
#   - push of a v*.*.* tag → automatic publish (the future-default path)
#   - workflow_dispatch with a tag input → manual publish against an existing
#     tag (needed for the first fire against v1.2.3, which was tagged before
#     this workflow file existed; see feedback_release_spine_first_fire_predates_tag)
#
# The workflow checks out the tag itself (not the trigger ref), so the
# published tarball contents always reflect what was tagged.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v1.2.3). Required for manual runs.'
        required: true
        type: string

permissions:
  contents: read
  id-token: write  # OIDC token for npm trusted publishing

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The tag we are publishing — from workflow_dispatch input on manual
      # runs, or derived from the trigger ref on automatic (tag-push) runs.
      PUBLISH_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Full history so the explicit tag checkout below has the ref.
          fetch-depth: 0

      - name: Check out the release tag
        run: |
          echo "Publishing tag: $PUBLISH_TAG"
          git fetch --tags --force
          git checkout "$PUBLISH_TAG"
          # Sanity: HEAD must now be the tag commit.
          git rev-parse HEAD

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - run: npm ci

      # Pre-publish gate: same `verify` flow CI runs. Catches any drift
      # between tag and main that would publish a broken artifact.
      - run: npm run verify

      # Publish all public workspaces with Sigstore provenance via OIDC.
      # `--workspaces --access public` walks every packages/*/package.json
      # and skips the ones marked `private: true` (root + portfolio).
      - name: Publish to npm
        run: npm publish --workspaces --access public --provenance
        env:
          NPM_CONFIG_PROVENANCE: true

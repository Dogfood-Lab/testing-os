policy_version: "1.0.0"

defaults:
  freshness:
    max_age_days: 30
    warn_age_days: 14
  execution_mode_policy:
    allowed: [bot, human, mixed]
  ci_requirements:
    coverage_min: null
    tests_must_pass: false
  evidence_requirements:
    required_kinds: []
    min_evidence_count: 0

global_rules:
  - id: schema-valid
    description: "Record must pass submission JSON Schema validation"
    severity: reject

  - id: provenance-confirmed
    description: "Source run must be verifiable via GitHub API"
    severity: reject

  - id: scenario-minimum
    description: "At least one scenario_result required"
    severity: reject

  - id: step-results-present
    description: "Every required_step in the scenario definition must have a matching step_result"
    severity: reject

  - id: step-verdict-consistent
    description: "Scenario cannot be pass if any required step is fail or blocked"
    severity: reject

  # VERIFY-F1 (v1.7.0): the FIRST built-in migrated to the declarative engine.
  # Its old hardcoded switch arm was removed; this `when` predicate is now the
  # enforcement, proven byte-identical to the old arm by the differential-
  # equivalence gate (packages/verify/predicate-attested-equivalence.test.js).
  # The implies node is the violation all(antecedent, not(consequent)): it matches
  # when execution_mode is human/mixed but attested_by is absent. See docs/policy-dsl.md.
  - id: attested-if-human
    description: "Human or mixed execution_mode requires attested_by field"
    severity: reject
    scope: scenario_result
    when:
      implies:
        - { field: execution_mode, op: in,     value: [human, mixed] }
        - { field: attested_by,    op: exists }
    reason_template: 'scenario "{scenario_id}": execution_mode is "{execution_mode}" but attested_by is missing'

  - id: blocked-needs-reason
    description: "Verdict blocked requires blocking_reason"
    severity: reject

  - id: no-verdict-upgrade
    description: "Verifier may downgrade proposed verdict, never upgrade"
    severity: reject

stale_thresholds:
  critical: 60
  warning: 30
  healthy: 14
